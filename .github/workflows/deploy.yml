name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm build

      - name: Compress Build Artifacts
        run: |
          tar -czf deploy.tar.gz .next public package.json pnpm-lock.yaml next.config.ts

      - name: Copy Files to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/photon-security"

      - name: Execute Deployment Scripts via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Navigate to project directory
            cd ~/photon-security || mkdir -p ~/photon-security && cd ~/photon-security
            
            # 2. Load shell environment (helps find pnpm/pm2)
            export PATH=$PATH:$HOME/.local/bin:$HOME/bin
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.zshrc ] && source ~/.zshrc
            
            # 3. Clean up old build to avoid tar 'File exists' errors
            rm -rf .next
            
            # 4. Extract the uploaded files
            tar -xzf deploy.tar.gz
            
            # 5. Install production dependencies
            pnpm install --prod --frozen-lockfile
            
            # 6. Clean up the compressed file
            rm deploy.tar.gz
            
            # 7. Start or Restart PM2 process
            if pm2 list | grep -q "photon-security"; then
              pm2 reload photon-security
            else
              pm2 start "pnpm start" --name "photon-security"
            fi
            
            # 8. Save PM2 list
            pm2 save

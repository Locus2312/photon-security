name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm build

      - name: Compress Build Artifacts
        # We compress only the files needed to run the Next.js production server
        run: |
          tar -czf deploy.tar.gz .next public package.json pnpm-lock.yaml next.config.ts

      - name: Copy Files to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/photon-security" # Adjust this to your server's project directory path

      - name: Execute Deployment Scripts via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/photon-security
            
            # 1. Extract the uploaded files
            tar -xzf deploy.tar.gz
            
            # 2. Install production dependencies only (saves RAM on 1GB Oracle instance)
            pnpm install --prod --frozen-lockfile
            
            # 3. Clean up the compressed file
            rm deploy.tar.gz
            
            # 4. Start or Restart PM2 process
            # Check if PM2 is managing our app; if so, restart it. Otherwise, start it.
            if pm2 list | grep -q "photon-security"; then
              pm2 reload photon-security
            else
              pm2 start "pnpm start" --name "photon-security"
            fi
            
            # 5. Save PM2 list so it restarts on server reboot
            pm2 save
